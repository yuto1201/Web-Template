name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run policy, lint, types, and tests
        run: npm run check

      - name: Enforce deployment workflow safety
        run: npm run deployment:lint

      - name: Enforce custom-domain workflow safety
        run: npm run domain:lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e

      - name: Verify clean-room template instantiation
        run: npm run template:verify

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format= --first-parent -m HEAD
          fi

  database:
    name: Database and Auth policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Reset, lint, test, and compare generated types
        run: npm run db:verify

      - name: Verify real local JWTs preserve RLS isolation
        run: npm run auth:verify

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: npm run db:stop
