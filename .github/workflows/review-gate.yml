name: Exact Head review policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  review-gate:
    name: Exact Head review policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: trusted/.node-version
          cache: npm
          cache-dependency-path: trusted/package-lock.json

      - name: Install trusted gate dependencies
        working-directory: trusted
        shell: bash
        run: |
          npm install --global npm@11.6.2
          npm ci --ignore-scripts

      - name: Verify exact-Head review evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          gate_path="trusted/tools/github-review-gate.mjs"
          workflow_path="trusted/config/workflow.json"
          execution_policy_path="trusted/config/execution.json"
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "Review gate requires a same-repository branch." >&2
            exit 1
          fi
          gate_output="$(node "$gate_path" \
            --event "$GITHUB_EVENT_PATH" \
            --repository "candidate" \
            --workflow "$workflow_path" \
            --execution-policy "$execution_policy_path" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA")"
          if [[ -z "$gate_output" ]]; then
            echo "Review gate produced no result." >&2
            exit 1
          fi
          printf '%s\n' "$gate_output"
